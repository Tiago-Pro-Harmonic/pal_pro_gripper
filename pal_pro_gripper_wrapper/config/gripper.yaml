gripper_grasper_srv:
  ros__parameters:
    # The name of the controller,
    controller_name:
      - ${EE_SIDE_PREFIX}_controller
    # Real joints that will be commanded 
    real_joint_names: 
      - ${EE_SIDE_PREFIX}_finger_joint

    max_position_error: 0.0015
    timeout: 5.0
    tolerance: 0.0005

    # Time for which to open/close the gripper
    opening_time: 0.5
    closing_time: 1.8

    # Open/closed joint value for pal-pro-gripper
    open_value: 0.0
    close_value: 0.8

